<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squirrel cam</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0b0e; color: #e5e5e5;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 0.8em; padding: 0.4em 0.9em;
    background: #14141a; border-bottom: 1px solid #222;
  }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em; }
  .right { display: flex; align-items: center; gap: 0.7em; }
  .stats { font-size: 0.85rem; color: #9aa; font-variant-numeric: tabular-nums; }
  .modes { display: inline-flex; border: 1px solid #2a2a35; border-radius: 5px; overflow: hidden; }
  .modes button {
    background: transparent; color: #aab; border: 0; padding: 4px 9px;
    font: inherit; font-size: 0.8rem; cursor: pointer;
  }
  .modes button.active { background: #2a3550; color: #fff; }
  .modes button:hover:not(.active) { background: #1c1c25; }

  main {
    height: calc(100% - 2.4em);
    padding: 6px;
  }
  /* Layouts: applied to <main> via data-mode. */
  main[data-mode="side"]    { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  main[data-mode="overlay"] { display: block; position: relative; }
  main[data-mode="off"]     { display: block; }

  .panel {
    position: relative; background: #000; border-radius: 6px;
    overflow: hidden; min-height: 200px; height: 100%;
  }
  .panel img, .panel canvas {
    display: block; width: 100%; height: 100%;
    object-fit: contain; image-rendering: pixelated;
  }
  /* In overlay mode, the thermal canvas floats over the video panel and
     the side-by-side gap collapses. */
  main[data-mode="overlay"] #therm-panel {
    position: absolute; inset: 6px; pointer-events: none;
    background: transparent;
  }
  main[data-mode="overlay"] #therm-panel canvas {
    opacity: 0.55;
    mix-blend-mode: screen;
  }
  main[data-mode="off"] #therm-panel { display: none; }

  .panel .overlay {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 4px 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0));
    font-size: 0.8rem; color: #ddd;
    display: flex; justify-content: space-between; pointer-events: none;
  }
  .panel .label {
    position: absolute; left: 8px; top: 6px;
    font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: #9aa; background: rgba(0,0,0,0.45); padding: 2px 6px; border-radius: 3px;
  }
  main[data-mode="overlay"] #vid-panel .label::after { content: " + thermal"; }

  @media (max-width: 720px) {
    main[data-mode="side"] { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Squirrel cam</h1>
  <div class="right">
    <span class="stats">
      <span id="fps">-- fps</span> &middot;
      <span id="trange">thermal --</span>
    </span>
    <span class="modes" role="tablist" aria-label="View mode">
      <button data-mode="side"    title="Video and thermal side by side">Side</button>
      <button data-mode="overlay" title="Thermal blended over video">Overlay</button>
      <button data-mode="off"     title="Hide thermal (saves CPU on the device)">Off</button>
    </span>
    <a href="/snapshot" style="color:#6af; font-size:0.85rem">snap</a>
  </div>
</header>
<main id="main" data-mode="side">
  <div class="panel" id="vid-panel">
    <span class="label">video</span>
    <img id="vid" src="/stream" alt="live video">
  </div>
  <div class="panel" id="therm-panel">
    <span class="label">thermal</span>
    <canvas id="therm" width="32" height="24"></canvas>
    <div class="overlay">
      <span id="tmin">--&deg;C</span>
      <span id="tmax">--&deg;C</span>
    </div>
  </div>
</main>

<script>
(() => {
  const W = 32, H = 24;
  const canvas = document.getElementById('therm');
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);

  // 24-stop "inferno"-ish ramp baked into the page (no asset fetch).
  const STOPS = [
    [0,0,4],[10,6,23],[24,12,47],[40,17,69],[58,22,87],[77,24,99],
    [96,27,106],[114,31,108],[133,34,106],[151,39,103],[170,44,97],
    [188,52,90],[205,61,82],[220,73,72],[233,88,62],[243,104,52],
    [250,122,42],[253,142,33],[253,164,26],[249,186,28],[242,208,44],
    [233,229,73],[228,248,111],[252,254,164]
  ];
  function lut(t) {
    t = Math.max(0, Math.min(1, t));
    const idx = t * (STOPS.length - 1);
    const i = Math.floor(idx), f = idx - i;
    const a = STOPS[i], b = STOPS[Math.min(i + 1, STOPS.length - 1)];
    return [
      a[0] + (b[0] - a[0]) * f | 0,
      a[1] + (b[1] - a[1]) * f | 0,
      a[2] + (b[2] - a[2]) * f | 0,
    ];
  }

  // ---- View mode: side / overlay / off ----
  const main = document.getElementById('main');
  const buttons = document.querySelectorAll('.modes button');
  function setMode(mode) {
    if (!['side','overlay','off'].includes(mode)) mode = 'side';
    main.dataset.mode = mode;
    buttons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    try { localStorage.setItem('sc.mode', mode); } catch (_) {}
  }
  buttons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  let saved = 'side';
  try { saved = localStorage.getItem('sc.mode') || 'side'; } catch (_) {}
  setMode(saved);

  // ---- Thermal polling: chained, never overlaps ----
  const POLL_MS = 250;        // ~4 Hz polling of /thermal
  const trange = document.getElementById('trange');
  const tminEl = document.getElementById('tmin');
  const tmaxEl = document.getElementById('tmax');

  async function pollOnce() {
    if (main.dataset.mode === 'off') return;          // skip while hidden
    try {
      const r = await fetch('/thermal', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      if (!Array.isArray(j.data) || j.data.length !== W * H ||
          typeof j.min !== 'number' || typeof j.max !== 'number') {
        throw new Error('bad shape');
      }
      const min = j.min, max = j.max;
      const span = Math.max(max - min, 0.5);
      // MLX90640 is mounted with column 0 on the sensor's right edge;
      // flip horizontally so the heatmap matches the camera orientation.
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const v = j.data[y * W + x];
          const t = (v - min) / span;
          const [r2, g2, b2] = lut(t);
          const o = (y * W + (W - 1 - x)) * 4;
          img.data[o] = r2; img.data[o+1] = g2; img.data[o+2] = b2; img.data[o+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      tminEl.textContent = min.toFixed(1) + '°C';
      tmaxEl.textContent = max.toFixed(1) + '°C';
      trange.textContent = 'thermal ' + min.toFixed(1) + '–' + max.toFixed(1) + '°C';
    } catch (e) {
      trange.textContent = 'thermal: ' + e.message;
    }
  }

  // Chained poll: only fire the next request after the previous has
  // settled, so a slow network can't pile up requests on the ESP32.
  async function pollLoop() {
    while (true) {
      await pollOnce();
      await new Promise(r => setTimeout(r, POLL_MS));
    }
  }
  pollLoop();

  // ---- FPS counter (Chromium fires a 'load' per multipart part) ----
  const v = document.getElementById('vid');
  let frames = 0, last = performance.now();
  v.addEventListener('load', () => { frames++; });
  setInterval(() => {
    const now = performance.now();
    const fps = frames * 1000 / (now - last);
    document.getElementById('fps').textContent = fps.toFixed(1) + ' fps';
    frames = 0; last = now;
  }, 1000);
})();
</script>
</body>
</html>
